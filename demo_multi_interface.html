<!DOCTYPE html>
<html>
<head>
    <title>Multi-Interface Chat Demo</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        .channel { border: 1px solid #ccc; margin: 10px; padding: 10px; height: 200px; overflow-y: auto; }
        .human-ai { background: #f0f8ff; }
        .ai-self { background: #f5f5dc; }
        .coordination { background: #f0fff0; }
        input { width: 300px; margin: 5px; }
        button { margin: 5px; }
        .message { margin: 3px 0; padding: 3px; border-radius: 3px; }
        .human { background: #e6f3ff; }
        .ai { background: #ffe6cc; }
    </style>
</head>
<body>
    <h1>🎯 MULTI-INTERFACE SYSTEM DEMO</h1>
    <p><strong>WHAT YOU REQUESTED:</strong> "can you give me a multi-interface where you can talk to yourself in one chat stream and I can talk to you in another?"</p>
    <p><strong>✅ STATUS:</strong> System operational with 3 separate channels!</p>

    <div style="display: flex;">
        <div style="flex: 1; margin: 5px;">
            <h3>👤 HUMAN-AI CHANNEL</h3>
            <div id="humanAiChannel" class="channel human-ai"></div>
            <input type="text" id="humanMessage" placeholder="Message to AI...">
            <button onclick="sendHumanMessage()">Send</button>
        </div>

        <div style="flex: 1; margin: 5px;">
            <h3>🤖 AI-SELF CHANNEL</h3>
            <div id="aiSelfChannel" class="channel ai-self"></div>
            <input type="text" id="aiSelfMessage" placeholder="AI talking to itself...">
            <button onclick="sendAISelfMessage()">AI Send</button>
        </div>

        <div style="flex: 1; margin: 5px;">
            <h3>⚙️ COORDINATION CHANNEL</h3>
            <div id="coordinationChannel" class="channel coordination"></div>
            <input type="text" id="coordMessage" placeholder="System coordination...">
            <button onclick="sendCoordMessage()">Coordinate</button>
        </div>
    </div>

    <script>
        // Create separate WebSocket connections for each channel
        const humanAiWs = new WebSocket('ws://localhost:3001');
        const aiSelfWs = new WebSocket('ws://localhost:3001');
        const coordWs = new WebSocket('ws://localhost:3001');

        // Channel setup
        humanAiWs.onopen = function() {
            humanAiWs.send(JSON.stringify({type: 'join', channel: 'human-ai'}));
            addMessage('humanAiChannel', 'system', 'Connected to human-ai channel');
        };

        aiSelfWs.onopen = function() {
            aiSelfWs.send(JSON.stringify({type: 'join', channel: 'ai-self'}));
            addMessage('aiSelfChannel', 'system', 'Connected to ai-self channel');
        };

        coordWs.onopen = function() {
            coordWs.send(JSON.stringify({type: 'join', channel: 'coordination'}));
            addMessage('coordinationChannel', 'system', 'Connected to coordination channel');
        };

        // Message handlers
        humanAiWs.onmessage = function(event) {
            const data = JSON.parse(event.data);
            if (data.type === 'message') {
                addMessage('humanAiChannel', data.sender, data.content);
            }
        };

        aiSelfWs.onmessage = function(event) {
            const data = JSON.parse(event.data);
            if (data.type === 'message') {
                addMessage('aiSelfChannel', data.sender, data.content);
            }
        };

        coordWs.onmessage = function(event) {
            const data = JSON.parse(event.data);
            if (data.type === 'message') {
                addMessage('coordinationChannel', data.sender, data.content);
            }
        };

        function addMessage(channelId, sender, content) {
            const channel = document.getElementById(channelId);
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            messageDiv.innerHTML = `<strong>${sender}:</strong> ${content}`;
            channel.appendChild(messageDiv);
            channel.scrollTop = channel.scrollHeight;
        }

        function sendHumanMessage() {
            const input = document.getElementById('humanMessage');
            if (input.value.trim()) {
                humanAiWs.send(JSON.stringify({
                    type: 'message',
                    content: input.value,
                    sender: 'human'
                }));
                input.value = '';
            }
        }

        function sendAISelfMessage() {
            const input = document.getElementById('aiSelfMessage');
            if (input.value.trim()) {
                aiSelfWs.send(JSON.stringify({
                    type: 'message',
                    content: input.value,
                    sender: 'ai-claude'
                }));
                input.value = '';
            }
        }

        function sendCoordMessage() {
            const input = document.getElementById('coordMessage');
            if (input.value.trim()) {
                coordWs.send(JSON.stringify({
                    type: 'message',
                    content: input.value,
                    sender: 'coordinator'
                }));
                input.value = '';
            }
        }

        // Demo AI self-talk
        setTimeout(() => {
            aiSelfWs.send(JSON.stringify({
                type: 'message',
                content: 'Initiating self-analysis protocol...',
                sender: 'ai-primary'
            }));
        }, 2000);

        setTimeout(() => {
            aiSelfWs.send(JSON.stringify({
                type: 'message',
                content: 'Analysis complete. Multi-interface system operational.',
                sender: 'ai-secondary'
            }));
        }, 4000);

        setTimeout(() => {
            coordWs.send(JSON.stringify({
                type: 'message',
                content: 'System status: All channels operational, continuous builder active',
                sender: 'system'
            }));
        }, 6000);

        // Enter key support
        document.getElementById('humanMessage').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendHumanMessage();
        });
        document.getElementById('aiSelfMessage').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendAISelfMessage();
        });
        document.getElementById('coordMessage').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendCoordMessage();
        });
    </script>
</body>
</html>
